<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid meet">
  <rect width="1200" height="360" fill="#000"/>

  <!-- Hexagon mark -->
  <g transform="translate(150 95)"
     stroke="#fff"
     stroke-width="3"
     fill="none"
     stroke-linecap="square"
     stroke-linejoin="miter">
    <path transform="scale(7)" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
  </g>

  <!-- Wordmark -->
  <text x="340" y="200"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="140"
        font-weight="900"
        letter-spacing="-4"
        fill="#fff">HERMETIC</text>

  <!-- Tagline -->
  <text x="344" y="248"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="28"
        font-weight="500"
        fill="#fff"
        opacity="0.6">Sealed envelopes for the internet.</text>

  <!-- Properties strip -->
  <text x="344" y="290"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="13"
        font-weight="700"
        letter-spacing="4"
        fill="#fff"
        opacity="0.4">END-TO-END ENCRYPTED &#xB7; ZERO-KNOWLEDGE &#xB7; DECENTRALIZED</text>

  <!-- Brutal corner ticks -->
  <path d="M 20 20 L 60 20 M 20 20 L 20 60" stroke="#fff" stroke-width="3" fill="none"/>
  <path d="M 1180 20 L 1140 20 M 1180 20 L 1180 60" stroke="#fff" stroke-width="3" fill="none"/>
  <path d="M 20 340 L 60 340 M 20 340 L 20 300" stroke="#fff" stroke-width="3" fill="none"/>
  <path d="M 1180 340 L 1140 340 M 1180 340 L 1180 300" stroke="#fff" stroke-width="3" fill="none"/>
</svg>
